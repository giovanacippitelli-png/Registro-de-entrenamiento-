<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2e3192">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Entrenamiento">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Registro de Entrenamiento</title>
<style>
  :root{
    --bg:#f3f4f8;
    --panel:#ffffff;
    --panel-2:#f7f8fb;
    --border:#dcdfea;
    --text:#1b1e33;
    --muted:#5d6280;
    --primary:#2e3192;
    --primary-2:#3d41b8;
    --on-primary:#ffffff;
    --primary-soft:#e9eafb;
    --ok:#1f7a45;
    --ok-soft:#e1f3e8;
    --danger:#b3261e;
    --danger-soft:#fbe9e7;
    --warn-soft:#fff4dc;
    --warn-border:#eac46b;
    --grid:#e6e8f0;
    --shadow:0 1px 2px rgba(20,22,60,.06),0 2px 8px rgba(20,22,60,.05);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12131c;
      --panel:#1c1e2b;
      --panel-2:#222536;
      --border:#30344a;
      --text:#e8e9f3;
      --muted:#a3a7c2;
      --primary:#a4a7ff;
      --primary-2:#b9bbff;
      --on-primary:#14152a;
      --primary-soft:#272a50;
      --ok:#62d394;
      --ok-soft:#183324;
      --danger:#ff8a80;
      --danger-soft:#3a1f1d;
      --warn-soft:#352b12;
      --warn-border:#8a6d25;
      --grid:#2b2e42;
      --shadow:none;
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{background:var(--bg);}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:16px;line-height:1.4;
    padding-bottom:env(safe-area-inset-bottom);
  }
  a{color:var(--primary);}
  button,input,select,textarea{font:inherit;color:inherit;}
  main{max-width:640px;margin:0 auto;padding:0 12px 120px;}

  /* Barra superior */
  .bar{
    position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:6px;
    margin:0 -12px 12px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;
    background:var(--bg);border-bottom:1px solid var(--border);
  }
  .bar-t{flex:1;min-width:0;}
  .bar h1{margin:0;font-size:20px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bar .sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .icon-btn{
    display:inline-flex;align-items:center;justify-content:center;flex:none;
    width:44px;height:44px;border-radius:12px;border:0;background:transparent;
    color:var(--primary);text-decoration:none;cursor:pointer;
  }
  .icon-btn:active{background:var(--primary-soft);}
  .icon-btn svg{width:24px;height:24px;}

  /* Botones */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    min-height:44px;padding:0 16px;border-radius:12px;border:1px solid transparent;
    font-weight:600;font-size:15px;text-decoration:none;cursor:pointer;white-space:nowrap;
  }
  .btn.primary{background:var(--primary);color:var(--on-primary);}
  .btn.primary:active{background:var(--primary-2);}
  .btn.ghost{background:var(--panel);border-color:var(--border);color:var(--primary);}
  .btn.danger{background:var(--panel);border-color:var(--border);color:var(--danger);}
  .btn.block{width:100%;}
  .btn.big{min-height:52px;font-size:17px;}
  .btn.sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:10px;}
  .btn svg{width:18px;height:18px;}

  .card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow);}
  h2.sec{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 4px 8px;font-weight:700;}
  .muted{color:var(--muted);}
  .small{font-size:13px;}
  .row{display:flex;align-items:center;gap:8px;}
  .sp{flex:1;}
  .empty{text-align:center;padding:36px 16px;color:var(--muted);}
  .empty p{margin:0 0 16px;}

  .in{
    width:100%;min-height:44px;padding:8px 12px;border-radius:12px;
    border:1px solid var(--border);background:var(--panel);font-size:16px;
  }
  .in:focus{outline:2px solid var(--primary);outline-offset:-1px;}
  textarea.in{min-height:72px;resize:vertical;}

  .banner{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;margin-bottom:12px;text-decoration:none;color:inherit;}
  .banner.live{background:var(--primary-soft);border:1px solid var(--primary);}
  .banner.warn{background:var(--warn-soft);border:1px solid var(--warn-border);}
  .banner b{display:block;}
  .banner .sp{min-width:0;}

  /* Lista de alumnos */
  .search{position:sticky;top:calc(66px + env(safe-area-inset-top));z-index:4;background:var(--bg);padding-bottom:10px;}
  .list{background:var(--panel);border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);}
  .li{display:flex;align-items:center;gap:12px;padding:12px 14px;text-decoration:none;color:inherit;border-top:1px solid var(--border);min-height:60px;}
  .li:first-child{border-top:0;}
  .li:active{background:var(--panel-2);}
  .li .t{flex:1;min-width:0;}
  .li .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .li .t span{font-size:13px;color:var(--muted);}
  .chev{color:var(--muted);width:18px;height:18px;flex:none;}
  button.li{width:100%;border-left:0;border-right:0;border-bottom:0;background:transparent;text-align:left;font:inherit;color:inherit;cursor:pointer;}
  .elegir .list{max-height:55vh;overflow-y:auto;}

  /* Pestañas de alumnos entrenando ahora */
  .bar{flex-wrap:wrap;}
  .tira{
    display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;
    flex-basis:100%;margin:0 -12px;padding:2px 12px;
  }
  main > .tira{margin:0 -12px 12px;}
  .tira::-webkit-scrollbar{display:none;}
  .tab{
    flex:none;display:flex;align-items:center;gap:8px;min-height:48px;padding:4px 12px 4px 4px;
    border-radius:24px;border:1px solid var(--border);background:var(--panel);color:var(--text);
    text-decoration:none;font:inherit;cursor:pointer;
  }
  .tab .av{width:38px;height:38px;font-size:13px;}
  .tab .tt{display:flex;flex-direction:column;line-height:1.15;text-align:left;}
  .tab .tt b{font-size:14px;font-weight:600;}
  .tab .tt small{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;}
  .tab.on{background:var(--primary);border-color:var(--primary);color:var(--on-primary);}
  .tab.on .av{background:var(--on-primary);color:var(--primary);}
  .tab.on .tt small{color:var(--on-primary);opacity:.85;}
  .tab.add{padding:4px 14px;color:var(--primary);border-style:dashed;}
  .tab.add svg{width:18px;height:18px;}
  .av{width:40px;height:40px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:var(--primary-soft);color:var(--primary);font-weight:700;font-size:15px;}
  .fab{
    position:fixed;right:max(16px,calc(50% - 304px));bottom:calc(20px + env(safe-area-inset-bottom));z-index:6;
    box-shadow:0 4px 14px rgba(20,22,60,.25);border-radius:28px;padding:0 20px;min-height:56px;
  }

  /* Ficha del alumno */
  .perfil{display:flex;gap:12px;align-items:flex-start;}
  .perfil .av{width:52px;height:52px;font-size:18px;}
  .perfil .t{flex:1;min-width:0;}
  .perfil .obj{font-weight:600;}
  .perfil .notas{white-space:pre-wrap;font-size:14px;color:var(--muted);margin-top:4px;}
  .rutina{display:flex;align-items:center;gap:8px;}
  .rutina .t{flex:1;min-width:0;}
  .rutina .t b{display:block;font-size:17px;}
  .rutina .t span{font-size:13px;color:var(--muted);}
  .chips{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{display:inline-flex;align-items:center;min-height:36px;padding:0 12px;border-radius:18px;background:var(--panel);border:1px solid var(--border);color:var(--text);text-decoration:none;font-size:14px;}
  .chip:active{background:var(--primary-soft);}

  /* Editor de rutina */
  .ej-edit{display:flex;gap:8px;align-items:flex-start;}
  .ej-edit .main{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px;}
  .ej-edit .meta{display:flex;gap:8px;}
  .ej-edit .meta select{width:124px;flex:none;padding-right:4px;}
  .ej-edit .tools{display:flex;flex-direction:column;gap:2px;}
  .ej-edit .tools .icon-btn{width:36px;height:36px;color:var(--muted);}
  .ej-edit .n{flex:none;width:24px;height:44px;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--muted);}

  /* Sesión */
  .ses-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
  .ses-head input{width:auto;flex:none;}
  .prog{margin-left:auto;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;}
  .progbar{height:6px;border-radius:3px;background:var(--grid);overflow:hidden;margin:-4px 0 14px;}
  .progbar i{display:block;height:100%;background:var(--ok);border-radius:3px;transition:width .2s;}
  .ej-h{display:flex;align-items:flex-start;gap:8px;}
  .ej-h h3{margin:0;font-size:17px;}
  .tag{display:inline-block;margin-top:3px;font-size:12px;padding:1px 8px;border-radius:10px;background:var(--primary-soft);color:var(--primary);font-weight:600;}
  .last{font-size:13px;color:var(--muted);margin:6px 0 8px;}
  .sets-h,.set{display:grid;grid-template-columns:40px 1fr 1fr;gap:8px;align-items:center;}
  .sets-h{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;text-align:center;margin-bottom:4px;}
  .set{padding:4px 0;}
  .chk{
    width:40px;height:40px;border-radius:50%;border:2px solid var(--border);background:var(--panel);
    font-weight:700;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;
  }
  .chk svg{width:20px;height:20px;}
  .set.ok .chk{background:var(--ok);border-color:var(--ok);color:var(--panel);}
  .step{display:flex;align-items:stretch;height:44px;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--panel);min-width:0;}
  .set.ok .step{border-color:var(--ok);background:var(--ok-soft);}
  .step button{width:38px;flex:none;border:0;background:transparent;color:var(--primary);font-size:22px;font-weight:600;cursor:pointer;padding:0;}
  .step button:active{background:var(--primary-soft);}
  .step input{
    flex:1;min-width:0;width:100%;border:0;background:transparent;text-align:center;
    font-size:18px;font-weight:600;font-variant-numeric:tabular-nums;padding:0;
  }
  .step input:focus{outline:none;background:var(--primary-soft);}
  .step input::placeholder{color:var(--muted);font-weight:400;opacity:.6;}
  .ej-f{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;}
  .foot{
    position:fixed;left:0;right:0;bottom:0;z-index:6;
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    background:var(--bg);border-top:1px solid var(--border);
  }
  .foot .inner{max-width:616px;margin:0 auto;display:flex;gap:8px;}

  /* Progreso */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
  .stat{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow);}
  .stat span{display:block;font-size:12px;color:var(--muted);}
  .stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums;}
  .stat small{display:block;font-size:12px;color:var(--muted);}
  .chart-h{display:flex;align-items:baseline;gap:8px;margin-bottom:4px;}
  .chart-h h3{margin:0;font-size:15px;}
  .readout{margin-left:auto;font-size:14px;font-variant-numeric:tabular-nums;color:var(--text);}
  .readout span{color:var(--muted);}
  .chart svg{display:block;width:100%;height:auto;touch-action:pan-y;}
  .chart .gl{stroke:var(--grid);stroke-width:1;}
  .chart .ax{fill:var(--muted);font-size:11px;font-variant-numeric:tabular-nums;}
  .chart .ln{fill:none;stroke:var(--primary);stroke-width:2;stroke-linejoin:round;stroke-linecap:round;}
  .chart .pt{fill:var(--primary);stroke:var(--panel);stroke-width:2;}
  .chart .guide{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3;}
  .chart .hl{fill:var(--primary);stroke:var(--panel);stroke-width:3;}
  .tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -14px;padding:0 14px;}
  table.hist{border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap;}
  table.hist th,table.hist td{padding:6px 10px;border-bottom:1px solid var(--border);text-align:center;}
  table.hist th{font-size:12px;color:var(--muted);font-weight:600;}
  table.hist td:first-child,table.hist th:first-child{text-align:left;color:var(--muted);position:sticky;left:0;background:var(--panel);}


  /* Formularios */
  .campos{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .campos > label{grid-column:1 / -1;}
  .campos > label.medio{grid-column:auto;min-width:0;}
  .sub-sec{grid-column:1 / -1;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin-top:4px;}
  .elegir .grupo,.grupo{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:10px 14px 4px;background:var(--panel-2);}
  .card > .grupo{padding:0;background:none;}
  .li.crear .av{background:var(--primary);color:var(--on-primary);}
  .chip-x{border:0;background:transparent;color:var(--muted);font-size:18px;line-height:1;margin:0 -6px 0 6px;padding:0 4px;cursor:pointer;}
  .lnk{border:0;background:none;color:var(--primary);font:inherit;font-weight:600;padding:0;cursor:pointer;text-decoration:underline;}

  /* Ficha: datos personales y último entrenamiento */
  .datos{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 8px;margin-top:12px;}
  .datos > div{min-width:0;}
  .datos span{display:block;font-size:12px;color:var(--muted);}
  .datos b{display:block;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .datos small{display:block;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;}
  .card.ultimo{display:flex;flex-direction:column;gap:10px;}
  .card.ultimo .t{display:flex;flex-direction:column;}
  .card.ultimo .t b{font-size:18px;}
  a.card.ultimo.live{flex-direction:row;align-items:center;text-decoration:none;color:inherit;border-color:var(--primary);background:var(--primary-soft);}
  a.card.ultimo.live .t{flex:1;}

  /* Detalles por ejercicio en la sesión */
  .det{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 8px;}
  .dchip{min-height:34px;padding:0 10px;border-radius:17px;border:1px dashed var(--border);background:var(--panel);color:var(--muted);font:inherit;font-size:13px;cursor:pointer;}
  .dchip.on{border-style:solid;border-color:var(--primary);color:var(--primary);background:var(--primary-soft);font-weight:600;}
  .dchip.dolor{border-style:solid;border-color:var(--danger);color:var(--danger);background:var(--danger-soft);font-weight:600;}
  .det-txt{font-size:13px;margin:-2px 0 8px;color:var(--text);}
  .det-txt.dolor,.txt-dolor{color:var(--danger);}
  .aviso-dolor{font-size:13px;color:var(--danger);background:var(--danger-soft);border-radius:10px;padding:6px 10px;margin:0 0 8px;}
  .dolor-dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block;background:var(--danger);margin-right:6px;}
  .dolor-dot.leve{opacity:.45;}
  .dolor-dot.moderado{opacity:.75;}
  table.hist tr.extra td{color:var(--muted);font-size:13px;}
  /* Diálogo */
  dialog{border:0;border-radius:18px;padding:0;width:min(92vw,480px);max-height:88dvh;overflow-y:auto;background:var(--panel);color:var(--text);box-shadow:0 10px 40px rgba(0,0,0,.3);}
  dialog::backdrop{background:rgba(10,12,30,.45);}
  .dlg{padding:18px;display:flex;flex-direction:column;gap:12px;}
  .dlg h2{margin:0;font-size:19px;}
  .dlg label{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted);font-weight:600;}
  .dlg .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;}
  .dlg .btns .sp{min-width:0;}

  .toast{
    position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
    background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;
    opacity:0;pointer-events:none;transition:.2s;z-index:20;max-width:90vw;text-align:center;
  }
  .actualizar{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top));z-index:30;box-shadow:0 4px 14px rgba(20,22,60,.3);}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
  .kv{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--border);}
  .kv:first-of-type{border-top:0;}
  .kv .t{flex:1;min-width:0;}
  .kv .t span{display:block;font-size:13px;color:var(--muted);}
  ol.pasos{margin:6px 0 0;padding-left:20px;font-size:14px;}
</style>
</head>
<body>
<main id="app"></main>
<dialog id="dlg"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="fileIn" accept="application/json,.json" hidden>

<script>
'use strict';

/* ---------- Utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
const app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const clave = s => String(s || '').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ');
function hoy(delta = 0){
  const d = new Date(); d.setDate(d.getDate() + delta);
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0, 10);
}
const fFecha = f => { if (!f) return ''; const [y, m, d] = f.split('-'); return `${d}/${m}/${y.slice(2)}`; };
const num = v => { if (v === '' || v == null) return null; const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : null; };
const fNum = n => n == null ? '' : String(Math.round(n * 100) / 100).replace('.', ',');
function haceDias(f){
  const d = Math.round((Date.parse(hoy()) - Date.parse(f)) / 864e5);
  if (d <= 0) return 'hoy';
  if (d === 1) return 'ayer';
  if (d < 7) return `hace ${d} días`;
  if (d < 60) { const s = Math.round(d / 7); return `hace ${s} ${s === 1 ? 'semana' : 'semanas'}`; }
  return `hace ${Math.round(d / 30)} meses`;
}
const iniciales = n => String(n || '?').trim().split(/\s+/).slice(0, 2).map(p => p[0]).join('').toUpperCase();
const fSet = x => x.p == null ? `${fNum(x.r)} reps` : `${fNum(x.p)}×${fNum(x.r)}`;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 2200);
}

const I = {
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  chev:'<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>',

/* ---------- Almacenamiento (IndexedDB en el celular) ---------- */
const Store = {
  db: null,
  async init(){
    try {
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open('registro-entrenamiento', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      });
    } catch (e) { this.db = null; }
  },
  get(k){
    if (!this.db) { try { return Promise.resolve(JSON.parse(localStorage.getItem('re:' + k))); } catch (e) { return Promise.resolve(null); } }
    return new Promise((res, rej) => {
      const q = this.db.transaction('kv').objectStore('kv').get(k);
      q.onsuccess = () => res(q.result ?? null);
      q.onerror = () => rej(q.error);
    });
  },
  set(k, v){
    if (!this.db) { localStorage.setItem('re:' + k, JSON.stringify(v)); return Promise.resolve(); }
    return new Promise((res, rej) => {
      const tx = this.db.transaction('kv', 'readwrite');
      tx.objectStore('kv').put(v, k);
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error);
    });
  }
};

const alumno = id => S.alumnos.find(a => a.id === id);
const porFecha = (a, b) => b.fecha.localeCompare(a.fecha) || (b.creado || 0) - (a.creado || 0);
const sesionesDe = id => S.sesiones.filter(s => s.alumnoId === id && s.fin).sort(porFecha);
const abiertas = () => S.sesiones.filter(s => !s.fin);
const hechas = it => it.sets.filter(x => x.ok);

// Lo último que hizo el alumno en ese ejercicio (se busca por nombre, en cualquier día de rutina).
function ultimoDe(alumnoId, nombre, excluirId, hastaFecha){
  const k = clave(nombre);
  for (const s of sesionesDe(alumnoId)) {
    if (s.id === excluirId || (hastaFecha && s.fecha > hastaFecha)) continue;
    const it = s.items.find(i => clave(i.nombre) === k && hechas(i).length);
    if (it) return { fecha: s.fecha, sets: hechas(it), it };
  }
  return null;
}
function nombresEjercicios(){
  const m = new Map();
  for (const a of S.alumnos) for (const r of a.rutinas) for (const e of r.ejercicios) if (e.nombre.trim()) m.set(clave(e.nombre), e.nombre.trim());
  for (const p of S.plantillas) for (const e of p.ejercicios) if (e.nombre.trim()) m.set(clave(e.nombre), e.nombre.trim());
  return [...m.values()].sort((a, b) => a.localeCompare(b, 'es'));
}

      <h2>${esc(titulo)}</h2>${html}

        if (c.tipo === 'textarea') return `${lab}<textarea class="in" name="${c.nombre}" placeholder="${esc(c.ph || '')}">${esc(c.valor || '')}</textarea></label>`;
        if (c.tipo === 'select') {
          const ops = typeof c.opciones === 'string' ? c.opciones
            : c.opciones.map(([v, t]) => `<option value="${esc(v)}" ${String(v) === String(c.valor ?? '') ? 'selected' : ''}>${esc(t)}</option>`).join('');
          return `${lab}<select class="in" name="${c.nombre}">${ops}</select></label>`;
        }
        const dl = c.lista ? `<datalist id="dl-${c.nombre}">${c.lista.map(v => `<option value="${esc(v)}">`).join('')}</datalist>` : '';
        return `${lab}<input class="in" name="${c.nombre}" type="${c.tipo || 'text'}" ${c.modo ? `inputmode="${c.modo}"` : ''} ${c.lista ? `list="dl-${c.nombre}"` : ''} value="${esc(c.valor ?? '')}" placeholder="${esc(c.ph || '')}" autocomplete="off">${dl}</label>`;

        ${peligro ? `<button type="button" class="btn danger" data-v="peligro">${esc(peligro)}</button>` : ''}

        <button type="button" class="btn ghost" data-v="cancelar">Cancelar</button>
        <button type="submit" class="btn primary">${esc(ok)}</button>
      </div></form>`;
    const f = dlg.querySelector('form');
    let listo = false;
    const fin = v => { if (listo) return; listo = true; dlg.close(); res(v); };
    f.onsubmit = e => {
      e.preventDefault();
      const d = {};
      for (const c of campos) {
        if (c.seccion) continue;
        d[c.nombre] = f.elements[c.nombre].value.trim();
        if (c.requerido && !d[c.nombre]) { f.elements[c.nombre].focus(); return; }
      }
      fin(d);
    };
    f.querySelectorAll('[data-v]').forEach(b => b.onclick = () => fin(b.dataset.v === 'peligro' ? 'peligro' : null));
    dlg.oncancel = e => { e.preventDefault(); fin(null); };
    dlg.showModal();
    const primero = f.querySelector('input.in, textarea.in');
    if (primero && campos.find(c => !c.seccion)?.foco !== false) primero.focus();
  });
}

// Lista para elegir una opción (alumno, día de rutina, ejercicio…), con buscador opcional.
// Con `crear`, si lo buscado no existe ofrece crearlo (devuelve 'nuevo:<texto>').
function elegir({ titulo, items, buscar, crear, vacio = 'No hay opciones.' }){
  return new Promise(res => {
    const fila = x => `<button type="button" class="li" data-id="${esc(x.id)}">
      ${x.av ? `<span class="av">${esc(x.av)}</span>` : ''}
      <span class="t"><b>${esc(x.t)}</b>${x.sub ? `<span>${esc(x.sub)}</span>` : ''}</span></button>`;
    const pintarLista = (texto = '') => {
      const k = clave(texto);
      const vis = items.filter(x => !k || clave(x.t).includes(k));
      let html = '', grupo = null;
      for (const x of vis) {
        if (x.grupo && x.grupo !== grupo) { grupo = x.grupo; html += `<div class="grupo">${esc(grupo)}</div>`; }
        html += fila(x);
      }
      if (crear && k && !items.some(x => clave(x.t) === k))
        html = `<button type="button" class="li crear" data-id="nuevo:${esc(texto.trim())}"><span class="av">+</span>
          <span class="t"><b>Crear “${esc(texto.trim())}”</b><span>Se agrega a la biblioteca</span></span></button>` + html;
      return html || `<div class="empty">${k ? 'Sin resultados.' : esc(vacio)}</div>`;
    };
    dlg.innerHTML = `<div class="dlg elegir"><h2>${esc(titulo)}</h2>
      ${buscar ? `<input class="in" type="search" placeholder="${crear ? 'Buscar o escribir uno nuevo…' : 'Buscar…'}" autocomplete="off">` : ''}
      <div class="list">${pintarLista()}</div>
      <div class="btns"><span class="sp"></span><button type="button" class="btn ghost" data-v>Cancelar</button></div></div>`;
    let listo = false;
    const fin = v => { if (listo) return; listo = true; dlg.close(); res(v); };
    const lista = dlg.querySelector('.list');
    lista.onclick = e => { const b = e.target.closest('[data-id]'); if (b) fin(b.dataset.id); };
    dlg.querySelector('[data-v]').onclick = () => fin(null);
    const q = dlg.querySelector('input');
    if (q) q.oninput = () => { lista.innerHTML = pintarLista(q.value); };
    dlg.oncancel = e => { e.preventDefault(); fin(null); };
    dlg.showModal();
  });
}

/* ---------- Biblioteca de ejercicios ---------- */
const BIBLIOTECA = [
  ['Tren inferior', ['Peso muerto', 'Hip thrust', 'Sentadilla', 'Sentadilla búlgara', 'Sillón de cuádriceps', 'Curl isquiotibial', 'Hip abducción', 'Pantorrillas']],
  ['Tren superior', ['Pull down', 'Remo Hammer', 'Remo neutro', 'Pull over', 'Vuelos', 'Face pull']]
];
// Ejercicios de la biblioteca base + los propios (creados a mano o usados en rutinas).
function biblioteca(){
  const vistos = new Set(), out = [];
  const add = (nombre, grupo) => { const k = clave(nombre); if (!k || vistos.has(k)) return; vistos.add(k); out.push({ id: nombre.trim(), t: nombre.trim(), grupo }); };
  for (const [g, ns] of BIBLIOTECA) ns.forEach(n => add(n, g));
  const propios = [...S.biblioteca, ...nombresEjercicios()].sort((a, b) => a.localeCompare(b, 'es'));
  propios.forEach(n => add(n, 'Mis ejercicios'));
  return out;
}
async function elegirEjercicio(titulo = 'Agregar ejercicio'){
  const id = await elegir({ titulo, items: biblioteca(), buscar: true, crear: true });
  if (!id) return null;
  if (id.startsWith('nuevo:')) {
    const n = id.slice(6).trim();
    if (!biblioteca().some(x => clave(x.t) === clave(n))) { S.biblioteca.push(n); guardar(); }
    return n;
  }
  return id;
}

const medicionesDe = a => (a.mediciones || []).slice().sort((x, y) => x.fecha.localeCompare(y.fecha));
// Último valor cargado de una medida y su cambio desde el primero.
function medida(a, k){
  const ms = medicionesDe(a).filter(m => m[k] != null);
  if (!ms.length) return null;
  const u = ms[ms.length - 1];
  return { v: u[k], fecha: u.fecha, dif: ms.length > 1 ? u[k] - ms[0][k] : null };
}
const fDif = d => d == null || Math.abs(d) < 0.05 ? '' : `${d > 0 ? '+' : '−'}${fNum(Math.abs(d))}`;
function imc(a){
  const p = medida(a, 'peso'), h = num(a.altura);
  return p && h ? p.v / ((h / 100) ** 2) : null;
}

/* ---------- Router ---------- */
let rutaAnterior = '';
let tras = []; // funciones a ejecutar después de pintar
const ir = h => { location.hash = h; };
window.addEventListener('hashchange', pintar);

function pintar(){
  const ruta = location.hash.replace(/^#\/?/, '');
  const p = ruta.split('/').filter(Boolean);
  tras = [];
  let v = null;
  if (p[0] === 'a' && p[1] && !p[2]) v = vAlumno(p[1]);
  else if (p[0] === 'a' && p[2] === 'r' && p[3]) v = vRutina(p[1], p[3]);
  else if (p[0] === 'a' && p[2] === 'p' && p[3]) v = vProgreso(p[1], decodeURIComponent(p[3]));
  else if (p[0] === 'a' && p[2] === 'm') v = vMedidas(p[1]);
  else if (p[0] === 's' && p[1]) v = vSesion(p[1]);
  else if (p[0] === 'ajustes') v = vAjustes();
  else if (!p.length) v = vInicio();
  if (v == null) { ir('/'); return; }
  if (ruta !== rutaAnterior) scrolls[rutaAnterior] = window.scrollY;
  app.innerHTML = v;
  // Al volver a la sesión de un alumno, queda donde estaba.
  if (ruta !== rutaAnterior) window.scrollTo(0, p[0] === 's' ? (scrolls[ruta] || 0) : 0);
  rutaAnterior = ruta;
  tras.forEach(f => f());
}
const scrolls = {};

function listaAlumnos(){
  const ult = {};
  for (const s of S.sesiones) if (s.fin && (!ult[s.alumnoId] || s.fecha > ult[s.alumnoId].fecha)) ult[s.alumnoId] = s;
  const q = clave(busqueda);
  const as = S.alumnos.filter(a => !q || clave(a.nombre).includes(q) || clave(a.objetivo).includes(q))
    .sort((a, b) => a.nombre.localeCompare(b.nombre, 'es'));

      <div class="t"><b>${esc(a.nombre)}</b><span>${esc(det)}</span></div>${I.chev}</a>`;

/* ---------- Vista: ficha del alumno ---------- */
function vAlumno(id){
  const a = alumno(id);
  if (!a) return null;
  const ses = sesionesDe(id);
  const ult = ses[0];
  const ultPorRutina = {};
  for (const s of ses) if (!ultPorRutina[s.rutinaId]) ultPorRutina[s.rutinaId] = s.fecha;
  const ejs = new Map();
  for (const s of ses) for (const it of s.items) if (hechas(it).length && !ejs.has(clave(it.nombre))) ejs.set(clave(it.nombre), it.nombre);
  const abierta = abiertas().find(s => s.alumnoId === a.id);
  const peso = medida(a, 'peso'), im = imc(a);
  const datos = [
    ['Frecuencia', a.frecuencia ? `${a.frecuencia}× semana` : '—'],
    ['Inicio', a.inicio ? fFecha(a.inicio) : '—', a.inicio ? haceDias(a.inicio).replace('hace ', '') : ''],
    ['Altura', a.altura ? `${fNum(a.altura)} cm` : '—'],
    ['Peso', peso ? `${fNum(peso.v)} kg` : '—', peso && peso.dif != null ? `${fDif(peso.dif) || '='} kg` : ''],
    ['IMC', im ? fNum(Math.round(im * 10) / 10) : '—'],
    ['Sesiones', ses.length]
  ];
  const molestias = [];
  for (const s of ses) for (const it of s.items) if (it.dolor) molestias.push({ s, it });
  const ms = medicionesDe(a);

  return barra(a.nombre, { atras: '/', accion: `<button class="icon-btn" data-act="editarAlumno" data-a="${a.id}" aria-label="Editar datos">${I.edit}</button>` }) + `
    <div class="card">
      <div class="perfil">
        <div class="av">${esc(iniciales(a.nombre))}</div>
        <div class="t">
          <div class="obj">${a.objetivo ? esc(a.objetivo) : '<span class="muted">Sin objetivo cargado</span>'}</div>
          ${a.notas ? `<div class="notas">${esc(a.notas)}</div>` : ''}
        </div>
      </div>
      <div class="datos">${datos.map(([t, v, s]) => `<div><span>${t}</span><b>${esc(v)}</b>${s ? `<small>${esc(s)}</small>` : ''}</div>`).join('')}</div>
    </div>

    ${abierta ? `<a class="card ultimo live" href="#/s/${abierta.id}">
        <div class="t"><span class="small muted">Entrenando ahora</span><b>${esc(abierta.rutinaNombre)}</b></div>
        <span class="btn primary">Continuar</span></a>`
      : ult ? `<div class="card ultimo">
        <div class="t"><span class="small muted">Último entrenamiento</span>
          <b>${esc(ult.rutinaNombre)} · ${fFecha(ult.fecha)}</b>
          <span class="small muted">${haceDias(ult.fecha)} · ${ult.items.length} ejercicios</span></div>
        <button class="btn primary block big" data-act="repetir" data-a="${a.id}">Repetir último entrenamiento</button>
        <p class="small muted" style="margin:6px 0 0">Arranca con los mismos ejercicios, series y pesos; se modifica en el momento.</p>
      </div>` : ''}

    <h2 class="sec">Rutina</h2>
    ${a.rutinas.map(r => `
      <div class="card rutina">
        <div class="t"><b>${esc(r.nombre)}</b>
          <span>${r.ejercicios.length} ejercicios${ultPorRutina[r.id] ? ` · última ${fFecha(ultPorRutina[r.id])}` : ''}</span></div>
        <a class="btn ghost sm" href="#/a/${a.id}/r/${r.id}">Editar</a>
        <button class="btn ${ult && !abierta ? 'ghost' : 'primary'}" data-act="entrenar" data-a="${a.id}" data-r="${r.id}">${abierta?.rutinaId === r.id ? 'Continuar' : 'Entrenar'}</button>
      </div>`).join('') || '<div class="card muted small">Todavía no tiene días de rutina. Agregá el primero.</div>'}
    <button class="btn ghost block" data-act="nuevoDia" data-a="${a.id}">${I.plus} Agregar día de rutina</button>

    <h2 class="sec">Medidas corporales</h2>
    <div class="card">
      ${ms.length ? `<div class="datos">${MEDIDAS.map(([k, t, u]) => { const m = medida(a, k); return m ? `<div><span>${t}</span><b>${fNum(m.v)} ${u}</b>${m.dif != null ? `<small>${fDif(m.dif) || '='} ${u}</small>` : ''}</div>` : ''; }).join('')}</div>
        <p class="small muted" style="margin:10px 0 0">Última medición: ${fFecha(ms[ms.length - 1].fecha)} · ${ms.length} ${ms.length === 1 ? 'medición' : 'mediciones'}</p>`
        : '<p class="small muted" style="margin:0">Todavía no hay medidas cargadas.</p>'}
      <div class="row" style="margin-top:10px">
        <button class="btn primary sm" data-act="nuevaMedicion" data-a="${a.id}">${I.plus} Nueva medición</button>
        ${ms.length ? `<a class="btn ghost sm" href="#/a/${a.id}/m">Ver historial</a>` : ''}
      </div>
    </div>

    ${molestias.length ? `<h2 class="sec">Dolor / molestias registradas</h2>
      <div class="list">${molestias.slice(0, 6).map(({ s, it }) => `<a class="li" href="#/s/${s.id}">
        <span class="dolor-dot ${esc(it.dolor)}"></span>
        <div class="t"><b>${esc(it.nombre)} · ${esc(it.dolor)}</b><span>${fFecha(s.fecha)}${it.dolorNota ? ' · ' + esc(it.dolorNota) : ''}</span></div>${I.chev}</a>`).join('')}</div>` : ''}

    ${ejs.size ? `<h2 class="sec">Progreso por ejercicio</h2>
      <div class="chips">${[...ejs].map(([k, n]) => `<a class="chip" href="#/a/${a.id}/p/${encodeURIComponent(k)}">${esc(n)}</a>`).join('')}</div>` : ''}

    ${ses.length ? `<h2 class="sec">Historial</h2>
      <div class="list">${ses.map(s => {
        const n = s.items.reduce((t, i) => t + hechas(i).length, 0);
        return `<a class="li" href="#/s/${s.id}"><div class="t"><b>${fFecha(s.fecha)} · ${esc(s.rutinaNombre)}</b>
          <span>${s.items.length} ejercicios · ${n} series${s.notas ? ' · ' + esc(s.notas) : ''}</span></div>${I.chev}</a>`;
      }).join('')}</div>` : ''}`;
}

/* ---------- Vista: historial de medidas ---------- */
function vMedidas(aid){
  const a = alumno(aid);
  if (!a) return null;
  const ms = medicionesDe(a);
  if (!ms.length) return barra('Medidas', { atras: `/a/${aid}`, sub: a.nombre }) + '<div class="empty">Todavía no hay medidas cargadas.</div>';
  const usadas = MEDIDAS.filter(([k]) => ms.some(m => m[k] != null));
  graficos = [];
  const pesos = ms.filter(m => m.peso != null).map(m => ({ f: m.fecha, y: m.peso }));
  const cint = ms.filter(m => m.cintura != null).map(m => ({ f: m.fecha, y: m.cintura }));
  const g = [pesos.length > 1 ? grafico('Peso', 'kg', pesos) : '', cint.length > 1 ? grafico('Cintura', 'cm', cint) : ''].join('');
  tras.push(activarGraficos);
  const cols = ms.slice().reverse();
  return barra('Medidas', { atras: `/a/${aid}`, sub: a.nombre, accion: `<button class="icon-btn" data-act="nuevaMedicion" data-a="${a.id}" aria-label="Nueva medición">${I.plus}</button>` }) + g + `
    <div class="card">
      <div class="tbl-wrap"><table class="hist">
        <thead><tr><th></th>${cols.map(m => `<th><button class="lnk" data-act="editarMedicion" data-a="${a.id}" data-m="${m.id}">${fFecha(m.fecha)}</button></th>`).join('')}</tr></thead>
        <tbody>${usadas.map(([k, t, u]) => `<tr><td>${t} <span class="muted">(${u})</span></td>${cols.map(m => `<td>${fNum(m[k])}</td>`).join('')}</tr>`).join('')}
          ${a.altura && ms.some(m => m.peso != null) ? `<tr><td>IMC</td>${cols.map(m => `<td>${m.peso != null ? fNum(Math.round(m.peso / ((a.altura / 100) ** 2) * 10) / 10) : ''}</td>`).join('')}</tr>` : ''}
        </tbody>
      </table></div>
      <p class="small muted" style="margin:10px 0 0">Tocá una fecha para corregir o borrar esa medición.</p>
    </div>`;
}

/* ---------- Vista: editar día de rutina ---------- */

  if (!r) return null;
  tras.push(() => {
    app.querySelectorAll('[data-ej]').forEach(el => {
      el.addEventListener(el.tagName === 'SELECT' ? 'change' : 'input', () => {
        const e = r.ejercicios[+el.closest('[data-i]').dataset.i];
        e[el.dataset.ej] = el.dataset.ej === 'series' ? +el.value : el.value;
        guardar();
      });
    });
    const nom = $('#rnom');
    nom.oninput = () => { r.nombre = nom.value; guardar(); };

  const opcSeries = n => Array.from({ length: 10 }, (_, i) => `<option value="${i + 1}" ${n === i + 1 ? 'selected' : ''}>${i + 1} ${i ? 'series' : 'serie'}</option>`).join('');
  return barra('Editar rutina', { atras: `/a/${aid}`, sub: a.nombre }) + `
    <div class="card"><label class="small muted" for="rnom" style="font-weight:600">Nombre del día</label>
      <input id="rnom" class="in" value="${esc(r.nombre)}" placeholder="Ej. Día 1, Espalda, Tren inferior"></div>

    ${r.ejercicios.map((e, i) => `
      <div class="card ej-edit" data-i="${i}">
        <div class="n">${i + 1}</div>
        <div class="main">
          <input class="in" data-ej="nombre" list="ejnombres" value="${esc(e.nombre)}" placeholder="Ejercicio (ej. Pull down)">
          <div class="meta">
            <select class="in" data-ej="series">${opcSeries(e.series)}</select>

          </div>
          <input class="in" data-ej="nota" value="${esc(e.nota || '')}" placeholder="Nota (prono, drop, técnica…)">
        </div>
        <div class="tools">
          <button class="icon-btn" data-act="ejMover" data-d="-1" aria-label="Subir" ${i ? '' : 'disabled'}>${I.up}</button>
          <button class="icon-btn" data-act="ejMover" data-d="1" aria-label="Bajar" ${i < r.ejercicios.length - 1 ? '' : 'disabled'}>${I.down}</button>
          <button class="icon-btn" data-act="ejBorrar" aria-label="Quitar">${I.x}</button>
        </div>
      </div>`).join('')}
    <button class="btn ghost block" data-act="ejNuevo" data-a="${aid}" data-r="${rid}">${I.plus} Agregar ejercicio</button>
    <div class="row" style="margin-top:22px;flex-wrap:wrap">
      <button class="btn ghost sm" data-act="aPlantilla" data-a="${aid}" data-r="${rid}">Guardar como plantilla</button>
      <span class="sp"></span>
      <button class="btn danger sm" data-act="borrarDia" data-a="${aid}" data-r="${rid}">${I.trash} Eliminar día</button>
    </div>
    <div class="foot"><div class="inner"><a class="btn primary big block" href="#/a/${aid}">Listo</a></div></div>`;
}

/* ---------- Vista: sesión (carga de series) ---------- */
function vSesion(sid){
  const s = S.sesiones.find(x => x.id === sid);
  const a = s && alumno(s.alumnoId);
  if (!a) return null;
  const paso = S.cfg.paso;
  tras.push(() => {
    app.querySelectorAll('.step input').forEach(inp => {
      inp.onfocus = () => inp.select();
      inp.oninput = () => {
        const { it, x, fila } = ubicarSet(s, inp);
        x[inp.dataset.f] = num(inp.value);
        if (!x.ok && inp.value !== '') { x.ok = true; pintarFila(fila, x); }
        actualizarProgreso(s); guardar();
      };
      inp.onblur = () => { const { x } = ubicarSet(s, inp); inp.value = fNum(x[inp.dataset.f]); };
    });
    $('#sfecha').onchange = e => { if (e.target.value) { s.fecha = e.target.value; guardar(); } };
    $('#snotas').oninput = e => { s.notas = e.target.value; guardar(); };
  });
  const total = s.items.reduce((t, i) => t + i.sets.length, 0);
  const listas = s.items.reduce((t, i) => t + hechas(i).length, 0);
  return barra(a.nombre, {
    atras: `/a/${a.id}`, sub: s.rutinaNombre + (s.fin ? ' · sesión guardada' : ''),
    accion: `<button class="icon-btn" data-act="borrarSesion" data-s="${s.id}" aria-label="Eliminar sesión" style="color:var(--danger)">${I.trash}</button>`,
    extra: s.fin ? '' : tiraSesiones(s.id)
  }) + `
    <div class="ses-head">
      <input id="sfecha" class="in" type="date" value="${s.fecha}" aria-label="Fecha">
      <span class="prog" id="prog">${listas}/${total} series</span>
    </div>
    <div class="progbar"><i id="progbar" style="width:${total ? listas / total * 100 : 0}%"></i></div>
    ${s.items.map((it, i) => {
      const u = ultimoDe(a.id, it.nombre, s.id, s.fecha);
      return `<section class="card" data-i="${i}">
        <div class="ej-h">
          <div class="sp"><h3>${esc(it.nombre)}</h3>${it.nota ? `<span class="tag">${esc(it.nota)}</span>` : ''}</div>
          <a class="icon-btn" style="width:36px;height:36px" href="#/a/${a.id}/p/${encodeURIComponent(clave(it.nombre))}" aria-label="Ver progreso">${I.chart}</a>
        </div>
        <div class="last">${u ? `Última vez (${fFecha(u.fecha)}): ${u.sets.map(fSet).join(' · ')}${u.it.rir != null ? ` · RIR ${u.it.rir}` : ''}` : 'Primera vez que lo hace'}</div>
        ${u?.it.dolor ? `<div class="aviso-dolor">⚠️ La última vez tuvo dolor ${esc(u.it.dolor)}${u.it.dolorNota ? `: ${esc(u.it.dolorNota)}` : ''}</div>` : ''}
        ${u?.it.tecnica ? `<div class="last">Técnica (última vez): ${esc(u.it.tecnica)}</div>` : ''}
        <div class="det">
          <button class="dchip ${it.rir != null ? 'on' : ''}" data-act="detalles">RIR ${it.rir ?? '—'}</button>
          <button class="dchip ${it.descanso ? 'on' : ''}" data-act="detalles">⏱ ${esc(it.descanso || 'Descanso')}</button>
          <button class="dchip ${it.tecnica ? 'on' : ''}" data-act="detalles">Técnica${it.tecnica ? ' ✓' : ''}</button>
          <button class="dchip ${it.dolor ? 'dolor' : ''}" data-act="detalles">${it.dolor ? `Dolor ${esc(it.dolor)}` : 'Dolor'}</button>
        </div>
        ${it.tecnica ? `<div class="det-txt"><b>Técnica:</b> ${esc(it.tecnica)}</div>` : ''}
        ${it.dolor && it.dolorNota ? `<div class="det-txt dolor"><b>Dolor:</b> ${esc(it.dolorNota)}</div>` : ''}
        <div class="sets-h"><span>Serie</span><span>kg</span><span>reps</span></div>
        ${it.sets.map((x, j) => filaSet(x, j, paso)).join('')}
        <div class="ej-f">
          <button class="btn ghost sm" data-act="serieMas">${I.plus} Serie</button>
          ${it.sets.length > 1 ? `<button class="btn ghost sm" data-act="serieMenos">− Serie</button>` : ''}
          <span class="sp"></span>
          <button class="icon-btn" style="width:36px;height:36px;color:var(--muted)" data-act="ejQuitar" aria-label="Quitar ejercicio de hoy">${I.x}</button>
          <button class="btn ghost sm" data-act="todasOk">${I.check} Todas</button>
        </div>
      </section>`;
    }).join('')}
    <button class="btn ghost block" data-act="ejExtra" data-s="${s.id}">${I.plus} Agregar ejercicio</button>
    <h2 class="sec">Notas de la sesión</h2>
    <textarea id="snotas" class="in" placeholder="Cómo se sintió, molestias, cambios…">${esc(s.notas || '')}</textarea>
    <div class="foot"><div class="inner">
      ${s.fin ? `<a class="btn primary big block" href="#/a/${a.id}">Listo</a>`
              : `<button class="btn primary big block" data-act="terminar" data-s="${s.id}">Terminar sesión</button>`}
    </div></div>`;
}
function filaSet(x, j){
  return `<div class="set ${x.ok ? 'ok' : ''}" data-s="${j}">
    <button class="chk" data-act="marcar" aria-label="Marcar serie ${j + 1} como hecha" aria-pressed="${x.ok}">${x.ok ? I.check : j + 1}</button>
    <div class="step"><button data-act="menos" data-f="p" aria-label="Menos peso">−</button><input data-f="p" inputmode="decimal" value="${fNum(x.p)}" placeholder="—" aria-label="Peso serie ${j + 1}"><button data-act="mas" data-f="p" aria-label="Más peso">+</button></div>
    <div class="step"><button data-act="menos" data-f="r" aria-label="Menos repeticiones">−</button><input data-f="r" inputmode="numeric" value="${fNum(x.r)}" placeholder="—" aria-label="Repeticiones serie ${j + 1}"><button data-act="mas" data-f="r" aria-label="Más repeticiones">+</button></div>
  </div>`;
}
function ubicarSet(s, el){
  const it = s.items[+el.closest('[data-i]').dataset.i];
  const fila = el.closest('[data-s]');
  return { it, fila, x: it.sets[+fila.dataset.s] };
}
function pintarFila(fila, x){
  fila.classList.toggle('ok', x.ok);
  const c = fila.querySelector('.chk');
  c.innerHTML = x.ok ? I.check : (+fila.dataset.s + 1);
  c.setAttribute('aria-pressed', x.ok);
}
function actualizarProgreso(s){
  const total = s.items.reduce((t, i) => t + i.sets.length, 0);
  const listas = s.items.reduce((t, i) => t + hechas(i).length, 0);
  $('#prog').textContent = `${listas}/${total} series`;
  $('#progbar').style.width = (total ? listas / total * 100 : 0) + '%';
  const tab = $('.tab.on small');
  if (tab) tab.textContent = `${listas}/${total}`;
}
const sesionActual = () => S.sesiones.find(x => x.id === location.hash.split('/')[2]);

/* ---------- Vista: progreso de un ejercicio ---------- */
let graficos = [];
function vProgreso(aid, k){
  const a = alumno(aid);
  if (!a) return null;
  const regs = [];
  for (const s of sesionesDe(aid).slice().reverse()) {
    const it = s.items.find(i => clave(i.nombre) === k && hechas(i).length);
    if (it) regs.push({ fecha: s.fecha, nombre: it.nombre, sets: hechas(it), it });
  }
  if (!regs.length) return barra('Progreso', { atras: `/a/${aid}` }) + '<div class="empty">Todavía no hay registros de este ejercicio.</div>';
  const conPeso = regs.some(r => r.sets.some(x => x.p != null));
  const pts = regs.map(r => {
    const max = Math.max(...r.sets.map(x => x.p ?? -Infinity));
    return {
      fecha: r.fecha,
      max: isFinite(max) ? max : null,
      vol: r.sets.reduce((t, x) => t + (x.p || 0) * (x.r || 0), 0),
      reps: r.sets.reduce((t, x) => t + (x.r || 0), 0)
    };
  });
  const nombre = regs[regs.length - 1].nombre;
  let stats;
  if (conPeso) {
    const mejor = pts.filter(p => p.max != null).reduce((m, p) => p.max > m.max ? p : m);
    const primero = pts.find(p => p.max != null), ultimo = [...pts].reverse().find(p => p.max != null);
    const dif = ultimo.max - primero.max;
    stats = [
      ['Mejor peso', `${fNum(mejor.max)} kg`, fFecha(mejor.fecha)],
      ['Cambio', `${dif > 0 ? '+' : ''}${fNum(dif)} kg`, `desde ${fFecha(primero.fecha)}`],
      ['Sesiones', regs.length, `desde ${fFecha(regs[0].fecha)}`]
    ];
  } else {
    const mejor = pts.reduce((m, p) => p.reps > m.reps ? p : m);
    stats = [['Más reps', mejor.reps, fFecha(mejor.fecha)], ['Sesiones', regs.length, `desde ${fFecha(regs[0].fecha)}`], ['Última', pts[pts.length - 1].reps + ' reps', fFecha(pts[pts.length - 1].fecha)]];
  }
  graficos = [];
  const series = conPeso
    ? [grafico('Peso máximo', 'kg', pts.filter(p => p.max != null).map(p => ({ f: p.fecha, y: p.max }))),
       grafico('Volumen (kg × reps)', 'kg', pts.map(p => ({ f: p.fecha, y: p.vol })))]
    : [grafico('Repeticiones totales', 'reps', pts.map(p => ({ f: p.fecha, y: p.reps })))];
  tras.push(activarGraficos);
  const maxSeries = Math.max(...regs.map(r => r.sets.length));
  const cols = regs.slice().reverse();
  return barra(nombre, { atras: `/a/${aid}`, sub: a.nombre }) + `
    <div class="stats">${stats.map(([t, v, s]) => `<div class="stat"><span>${t}</span><b>${esc(v)}</b><small>${esc(s)}</small></div>`).join('')}</div>
    ${series.join('')}
    ${regs.filter(r => r.it.tecnica || r.it.dolor).length ? `<div class="card"><div class="chart-h"><h3>Observaciones</h3></div>
      ${regs.slice().reverse().filter(r => r.it.tecnica || r.it.dolor).map(r => `<div class="kv"><div class="t"><b>${fFecha(r.fecha)}</b>
        ${r.it.tecnica ? `<span>Técnica: ${esc(r.it.tecnica)}</span>` : ''}
        ${r.it.dolor ? `<span class="txt-dolor">Dolor ${esc(r.it.dolor)}${r.it.dolorNota ? ': ' + esc(r.it.dolorNota) : ''}</span>` : ''}</div></div>`).join('')}
    </div>` : ''}
    <div class="card">
      <div class="chart-h"><h3>Planilla</h3><span class="readout"><span>peso × reps</span></span></div>
      <div class="tbl-wrap"><table class="hist">
        <thead><tr><th>Serie</th>${cols.map(r => `<th>${fFecha(r.fecha)}</th>`).join('')}</tr></thead>
        <tbody>${Array.from({ length: maxSeries }, (_, j) => `<tr><td>${j + 1}</td>${cols.map(r => `<td>${r.sets[j] ? fSet(r.sets[j]) : ''}</td>`).join('')}</tr>`).join('')}
          ${[['RIR', r => r.it.rir ?? ''], ['Descanso', r => esc(r.it.descanso || '')], ['Dolor', r => r.it.dolor ? `<span class="dolor-dot ${esc(r.it.dolor)}"></span>${esc(r.it.dolor)}` : '']]
            .filter(([, f]) => cols.some(r => f(r) !== '')).map(([t, f]) => `<tr class="extra"><td>${t}</td>${cols.map(r => `<td>${f(r)}</td>`).join('')}</tr>`).join('')}
        </tbody>
      </table></div>

function pasoLindo(bruto){
  const e = 10 ** Math.floor(Math.log10(bruto));
  const f = bruto / e;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * e;
}
function grafico(titulo, unidad, pts){
  const W = 340, H = 170, L = 40, R = 14, T = 12, B = 24;
  const ys = pts.map(p => p.y);
  let lo = Math.min(...ys), hi = Math.max(...ys);
  if (lo === hi) { lo -= Math.max(1, Math.abs(lo) * .1); hi += Math.max(1, Math.abs(hi) * .1); }
  const paso = pasoLindo((hi - lo) / 3);
  lo = Math.floor(lo / paso) * paso; hi = Math.ceil(hi / paso) * paso;
  if (lo < 0 && Math.min(...ys) >= 0) lo = 0;
  const ts = pts.map(p => Date.parse(p.f));
  const t0 = Math.min(...ts), t1 = Math.max(...ts);
  const px = pts.map((_, i) => t1 === t0 ? L + (W - L - R) / 2 : L + (ts[i] - t0) / (t1 - t0) * (W - L - R));
  const py = pts.map(p => T + (hi - p.y) / (hi - lo) * (H - T - B));
  const ticks = [];
  for (let v = lo; v <= hi + paso / 2; v += paso) ticks.push(v);
  const idx = graficos.push({ pts, px, py, unidad, W, H, T, B }) - 1;
  const u = pts[pts.length - 1];
  return `<div class="card chart" data-g="${idx}">
    <div class="chart-h"><h3>${esc(titulo)}</h3><span class="readout" data-ro>${lectura(u, unidad)}</span></div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(titulo)}: de ${fNum(pts[0].y)} a ${fNum(u.y)} ${unidad}">
      ${ticks.map(v => { const y = T + (hi - v) / (hi - lo) * (H - T - B); return `<line class="gl" x1="${L}" x2="${W - R}" y1="${y}" y2="${y}"/><text class="ax" x="${L - 6}" y="${y + 4}" text-anchor="end">${fNum(v)}</text>`; }).join('')}
      <text class="ax" x="${px[0]}" y="${H - 6}" text-anchor="${pts.length > 1 ? 'start' : 'middle'}">${fFecha(pts[0].f)}</text>
      ${pts.length > 1 ? `<text class="ax" x="${px[px.length - 1]}" y="${H - 6}" text-anchor="end">${fFecha(u.f)}</text>` : ''}
      ${pts.length > 1 ? `<path class="ln" d="${px.map((x, i) => (i ? 'L' : 'M') + x.toFixed(1) + ' ' + py[i].toFixed(1)).join('')}"/>` : ''}
      ${px.map((x, i) => `<circle class="pt" cx="${x}" cy="${py[i]}" r="4"/>`).join('')}
      <g data-hov style="display:none"><line class="guide" y1="${T}" y2="${H - B}"/><circle class="hl" r="6"/></g>
      <rect x="0" y="0" width="${W}" height="${H}" fill="transparent" data-hit/>
    </svg></div>`;
}
const lectura = (p, u) => `<span>${fFecha(p.f)}</span> <b>${fNum(p.y)} ${u}</b>`;
function activarGraficos(){
  app.querySelectorAll('.chart[data-g]').forEach(c => {
    const g = graficos[+c.dataset.g];
    const svg = c.querySelector('svg'), hov = c.querySelector('[data-hov]'), ro = c.querySelector('[data-ro]');
    const mostrar = e => {
      const r = svg.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width * g.W;
      let k = 0;
      g.px.forEach((v, i) => { if (Math.abs(v - x) < Math.abs(g.px[k] - x)) k = i; });
      hov.style.display = '';
      const [ln, ci] = hov.children;
      ln.setAttribute('x1', g.px[k]); ln.setAttribute('x2', g.px[k]);
      ci.setAttribute('cx', g.px[k]); ci.setAttribute('cy', g.py[k]);
      ro.innerHTML = lectura(g.pts[k], g.unidad);
    };
    const ocultar = () => { hov.style.display = 'none'; ro.innerHTML = lectura(g.pts[g.pts.length - 1], g.unidad); };
    svg.addEventListener('pointermove', mostrar);
    svg.addEventListener('pointerdown', mostrar);
    svg.addEventListener('pointerleave', ocultar);
  });
}

async function entregarArchivo(nombre, contenido, tipo){
  const blob = new Blob([contenido], { type: tipo });
  try {
    const file = new File([blob], nombre, { type: tipo });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: nombre });
      return true;
    }
  } catch (e) { if (e.name === 'AbortError') return false; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = nombre;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  return true;
}
function csv(){
  const c = v => { const s = String(v ?? ''); return /[;"\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const filas = [['Alumno', 'Objetivo', 'Fecha', 'Día', 'Ejercicio', 'Serie', 'Peso (kg)', 'Reps', 'RIR', 'Descanso', 'Técnica', 'Dolor', 'Detalle dolor']];
  for (const s of S.sesiones.filter(x => x.fin).sort((a, b) => a.fecha.localeCompare(b.fecha))) {
    const a = alumno(s.alumnoId);
    for (const it of s.items) hechas(it).forEach((x, j) =>
      filas.push([a?.nombre, a?.objetivo, fFecha(s.fecha), s.rutinaNombre, it.nombre, j + 1, fNum(x.p), fNum(x.r),
        it.rir ?? '', it.descanso || '', it.tecnica || '', it.dolor || '', it.dolorNota || '']));
  }
  return '﻿' + filas.map(f => f.map(c).join(';')).join('\r\n');
}

      { nombre: 'tecnica', etiqueta: 'Técnica / observación', tipo: 'textarea', valor: it.tecnica, ph: 'Correcciones, rango, tempo…' },
      { nombre: 'dolor', etiqueta: 'Dolor / molestia', tipo: 'select', opciones: DOLOR, valor: it.dolor || '', medio: true },
      { nombre: 'dolorNota', etiqueta: '¿Dónde? ¿Cuándo?', valor: it.dolorNota, ph: 'Ej. rodilla al bajar', medio: true }
    ] });
    if (!d) return;
    it.rir = d.rir === '' ? null : +d.rir;
    it.descanso = d.descanso; it.tecnica = d.tecnica;
    it.dolor = d.dolor || null; it.dolorNota = d.dolor ? d.dolorNota : '';
    guardar(); pintar();
  },
  ejQuitar(el){
    const s = sesionActual(), i = +el.closest('[data-i]').dataset.i;
    if (!confirm(`¿Quitar “${s.items[i].nombre}” de la sesión de hoy?`)) return;
    s.items.splice(i, 1); guardar(); pintar();
  },
  async ejExtra(el){
    const s = S.sesiones.find(x => x.id === el.dataset.s);
    const nombre = await elegirEjercicio();
    if (!nombre) return;
    const u = ultimoDe(s.alumnoId, nombre, s.id, s.fecha);
    const n = u ? u.sets.length : 3;
    s.items.push({ ejId: null, nombre, nota: '', descanso: u?.it.descanso || '', sets: Array.from({ length: n }, (_, i) => {
      const b = u ? u.sets[i] : null;
      return { p: b ? b.p : null, r: b ? b.r : null, ok: false };
    }) });
    guardar(); pintar();
    requestAnimationFrame(() => app.querySelector(`[data-i="${s.items.length - 1}"]`)?.scrollIntoView({ behavior: 'smooth', block: 'center' }));
  },
  terminar(el){
    const s = S.sesiones.find(x => x.id === el.dataset.s);
    const total = s.items.reduce((t, i) => t + i.sets.length, 0);
    const listas = s.items.reduce((t, i) => t + hechas(i).length, 0);
    if (!listas) {
      if (confirm('No marcaste ninguna serie. ¿Descartar esta sesión?')) { S.sesiones = S.sesiones.filter(x => x !== s); guardar(); ir('/a/' + s.alumnoId); }
      return;
    }
    if (listas < total && !confirm(`Hay ${total - listas} series sin marcar (✓). No se van a guardar. ¿Terminar igual?`)) return;
    s.items = s.items.map(i => ({ ...i, sets: hechas(i).filter(x => x.p != null || x.r != null) })).filter(i => i.sets.length);
    const r = alumno(s.alumnoId).rutinas.find(x => x.id === s.rutinaId);
    const firma = its => its.map(i => clave(i.nombre) + ':' + (i.series ?? i.sets.length)).join('|');
    if (r && firma(r.ejercicios.filter(e => e.nombre.trim())) !== firma(s.items)
        && confirm(`Hoy cambiaron ejercicios o series respecto de “${r.nombre}”. ¿Guardar estos cambios en la rutina para la próxima?`)) {
      const prev = new Map(r.ejercicios.map(e => [clave(e.nombre), e]));
      r.ejercicios = s.items.map(i => {
        const e = prev.get(clave(i.nombre));
        return { id: e?.id || uid(), nombre: i.nombre, series: i.sets.length, nota: e?.nota ?? i.nota ?? '', descanso: i.descanso || e?.descanso || '' };
      });
    }
    s.fin = true; guardarYa();
    toast(`Sesión de ${alumno(s.alumnoId).nombre.split(/\s+/)[0]} guardada ✓`);
    // Si hay otros alumnos entrenando, sigue con el siguiente.
    const otra = abiertas().filter(x => alumno(x.alumnoId)).sort((x, y) => x.creado - y.creado)[0];
    ir(otra ? '/s/' + otra.id : '/a/' + s.alumnoId);
  },
  borrarSesion(el){
    const s = S.sesiones.find(x => x.id === el.dataset.s);
    if (!confirm(s.fin ? `¿Eliminar la sesión del ${fFecha(s.fecha)}? No se puede deshacer.` : '¿Descartar esta sesión?')) return;
    S.sesiones = S.sesiones.filter(x => x !== s); guardar(); ir('/a/' + s.alumnoId);
  },
  async respaldo(){
    const nombre = `respaldo-entrenamiento-${hoy()}.json`;
    await guardarYa();
    if (await entregarArchivo(nombre, JSON.stringify(S), 'application/json')) {
      S.ultimoRespaldo = hoy(); guardar(); pintar(); toast('Respaldo listo');
    }
  },
  restaurar(){ $('#fileIn').click(); },
  async csv(){ await entregarArchivo(`entrenamiento-${hoy()}.csv`, csv(), 'text/csv'); },
  async sumarABiblioteca(){
    const d = await formulario({ titulo: 'Nuevo ejercicio', ok: 'Agregar', campos: [{ nombre: 'nombre', etiqueta: 'Nombre', requerido: true }] });
    if (!d) return;
    if (biblioteca().some(x => clave(x.t) === clave(d.nombre))) { toast('Ya está en la biblioteca'); return; }
    S.biblioteca.push(d.nombre); guardar(); pintar();
  },
  borrarDeBiblioteca(el){
    S.biblioteca.splice(+el.dataset.i, 1); guardar(); pintar();
  },
  borrarPlantilla(el){
    const p = S.plantillas.find(x => x.id === el.dataset.p);
    if (!confirm(`¿Eliminar la plantilla “${p.nombre}”?`)) return;
    S.plantillas = S.plantillas.filter(x => x !== p); guardar(); pintar();
  },
  async instalar(){ if (eventoInstalar) { eventoInstalar.prompt(); await eventoInstalar.userChoice; eventoInstalar = null; pintar(); } },
  ejemplo(){ const a = cargarEjemplo(); ir('/a/' + a.id); },
  borrarTodo(){
    if (!confirm('¿Borrar TODOS los alumnos y sesiones de este celular?')) return;
    if (!confirm('Última confirmación: esto no se puede deshacer. ¿Seguro?')) return;
    S = estadoVacio(); guardarYa(); ir('/');
  }
};
function iniciarSesion(a, r){
  const abierta = abiertas().find(s => s.alumnoId === a.id);
  if (abierta) {
    if (abierta.rutinaId === r.id) return ir('/s/' + abierta.id);
    if (!confirm(`${a.nombre} tiene una sesión de “${abierta.rutinaNombre}” sin terminar. ¿Descartarla y empezar “${r.nombre}”?`)) return ir('/s/' + abierta.id);
    S.sesiones = S.sesiones.filter(s => s !== abierta);
  }
  const f = hoy();
  const s = {
    id: uid(), alumnoId: a.id, rutinaId: r.id, rutinaNombre: r.nombre, fecha: f, creado: Date.now(), fin: false, notas: '',
    // Cada serie arranca con lo que hizo la última vez: si repite, solo toca ✓.
    items: r.ejercicios.filter(e => e.nombre.trim()).map(e => {
      const u = ultimoDe(a.id, e.nombre, null, f);
      const sets = Array.from({ length: Math.max(1, e.series || 1) }, (_, i) => {
        const b = u ? (u.sets[i] || u.sets[u.sets.length - 1]) : null;
        return { p: b ? b.p : null, r: b ? b.r : null, ok: false };
      });
      return { ejId: e.id, nombre: e.nombre.trim(), nota: e.nota || '', descanso: e.descanso || u?.it.descanso || '', sets };
    })
  };
  S.sesiones.push(s); guardar(); ir('/s/' + s.id);
}
// Arranca una sesión idéntica a la última (ejercicios, series, pesos y descansos) para ir ajustando en el día.
function repetirUltimo(a){
  const ult = sesionesDe(a.id)[0];
  if (!ult) return;
  const abierta = abiertas().find(s => s.alumnoId === a.id);
  if (abierta) {
    if (!confirm(`${a.nombre} tiene una sesión sin terminar. ¿Descartarla y repetir el último entrenamiento?`)) return ir('/s/' + abierta.id);
    S.sesiones = S.sesiones.filter(s => s !== abierta);
  }
  const s = {
    id: uid(), alumnoId: a.id, rutinaId: ult.rutinaId, rutinaNombre: ult.rutinaNombre, fecha: hoy(), creado: Date.now(), fin: false, notas: '',
    items: ult.items.map(i => ({ ejId: i.ejId, nombre: i.nombre, nota: i.nota || '', descanso: i.descanso || '', sets: i.sets.map(x => ({ p: x.p, r: x.r, ok: false })) }))
  };
  S.sesiones.push(s); guardar(); ir('/s/' + s.id);
}
async function editarMedicion(a, m){
  const d = await formulario({
    titulo: m ? `Medición del ${fFecha(m.fecha)}` : 'Nueva medición', peligro: m ? 'Eliminar' : null,
    campos: [
      { nombre: 'fecha', etiqueta: 'Fecha', tipo: 'date', valor: m?.fecha || hoy(), medio: true, foco: false },
      ...MEDIDAS.map(([k, t, u]) => ({ nombre: k, etiqueta: `${t} (${u})`, modo: 'decimal', valor: fNum(m?.[k]), medio: true }))
    ]
  });
  if (d === 'peligro') {
    if (!confirm('¿Eliminar esta medición?')) return;
    a.mediciones = a.mediciones.filter(x => x !== m); guardar(); pintar(); return;
  }
  if (!d) return;
  const nueva = m || { id: uid() };
  nueva.fecha = d.fecha || hoy();
  for (const [k] of MEDIDAS) nueva[k] = num(d[k]);
  if (!MEDIDAS.some(([k]) => nueva[k] != null)) { toast('No cargaste ninguna medida'); return; }
  if (!m) a.mediciones.push(nueva);
  guardar(); pintar(); toast('Medición guardada');
}
function rutinaActual(){
  const p = location.hash.split('/');
  return alumno(p[2])?.rutinas.find(r => r.id === p[4]);
}
function ajustar(el, signo){
  const s = sesionActual(), { fila, x } = ubicarSet(s, el);
  const f = el.dataset.f, paso = f === 'p' ? S.cfg.paso : 1;
  const nuevo = Math.max(0, Math.round(((x[f] ?? 0) + signo * paso) * 100) / 100);
  x[f] = nuevo;
  fila.querySelector(`input[data-f="${f}"]`).value = fNum(nuevo);
  if (!x.ok) { x.ok = true; pintarFila(fila, x); }
  actualizarProgreso(s); guardar();
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  e.preventDefault();
  A[el.dataset.act]?.(el, e);
});
document.addEventListener('change', e => {
  if (e.target.id === 'paso') {
    const v = num(e.target.value);
    if (v && v > 0) { S.cfg.paso = v; guardar(); toast(`Botón de peso: ±${fNum(v)} kg`); }
    else e.target.value = fNum(S.cfg.paso);
  }
});
$('#fileIn').addEventListener('change', async e => {
  const f = e.target.files[0];
  e.target.value = '';
  if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!d || !Array.isArray(d.alumnos) || !Array.isArray(d.sesiones)) throw new Error('formato');
    const n = d.sesiones.filter(s => s.fin).length;
    if (!confirm(`El respaldo tiene ${d.alumnos.length} alumnos y ${n} sesiones. Va a reemplazar lo que hay ahora en este celular. ¿Continuar?`)) return;
    S = normalizar(d); await guardarYa();
    toast('Respaldo restaurado'); ir('/'); pintar();
  } catch (err) {
    alert('No se pudo leer el archivo. ¿Es un respaldo descargado desde esta app?');
  }
});

/* ---------- Inicio ---------- */
(async () => {
  await Store.init();
  try { S = normalizar(await Store.get('state')); } catch (e) { S = estadoVacio(); }
  if (navigator.storage?.persist) navigator.storage.persist().catch(() => {});
  pintar();
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    // Si llega una versión nueva de la app, ofrece recargar (los datos no se tocan).
    const habia = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!habia || $('#actualizar')) return;
      const b = document.createElement('button');
      b.id = 'actualizar'; b.className = 'btn primary actualizar';
      b.textContent = 'Hay una versión nueva · Actualizar';
      b.onclick = async () => { await guardarYa(); location.reload(); };
      document.body.appendChild(b);
    });
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
